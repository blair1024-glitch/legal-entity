name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements-dev.txt

      # 測試全程離線，用 fixtures/ 的合成樣本，不會打到證交所
      - name: 執行測試
        run: pytest -q

      # doctor 在 fixture 模式下應該每個來源都通過——這同時驗證了
      # 合成樣本與 parser 沒有脫節
      - name: 離線診斷
        run: |
          pip install -e .
          twflow --mode fixture doctor --date 2026-08-27

      # 端到端：產生示範資料 → 起伺服器 → 打每個 API
      - name: 煙霧測試
        run: |
          twflow demo --days 2
          twflow serve --port 8899 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8899/healthz >/dev/null && break
            sleep 0.5
          done
          for ep in /api/meta /api/quadrant /api/stocks /api/watchlist \
                    /api/institutional /api/futures /api/brokers /api/accuracy /; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8899$ep")
            echo "$ep -> $code"
            [ "$code" = "200" ] || exit 1
          done
