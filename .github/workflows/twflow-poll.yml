name: twflow · 盤中輪詢

# cron 全部是 UTC，台北 = UTC+8（無日光節約，換算固定）。
#
# 原本設 5 分鐘一輪（GitHub Actions 支援的最短間隔），實測結果是：
# 一個交易日內 53 次排定觸發，實際只有 2 次真的執行，而且都晚了
# 1～6 小時、早就收盤了——state/twflow.db 完全沒有新增任何一筆。
# 這不是程式邏輯的問題（poll 自己用 is_session_open() 判斷，收盤後
# 乾淨跳過），是 GitHub 官方自己說的「高頻排程在系統負載高時會被
# 延遲甚至跳過」在這裡真實發生了，而且比想像中嚴重很多。
#
# 改成 15 分鐘一輪（偏移 :07/:22/:37/:52 避開整點與半點壅塞，GitHub
# 官方建議），賭觸發次數變少、排隊競爭變少之後，準時送達的機率會
# 提高。這是嘗試，不是保證——如果還是大量漏跳，代表問題不是頻率
# 而是這個帳號/repo 的排程本來就不可靠，屆時得考慮外部觸發器或
# 乾脆以本機 `twflow auto` 為主、GitHub Pages 版只當 best-effort。
on:
  schedule:
    - cron: '7,22,37,52 1-4 * * 1-5'
    - cron: '7,22 5 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

# 跟 eod、compact-state 共用同一個 group：三者都會推 data-state 分支，
# 序列化執行才不會互相把對方剛 push 的 commit 蓋掉。
concurrency:
  group: twflow-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 twflow
        run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps

      - name: 準備 data-state worktree
        uses: ./.github/actions/checkout-state

      # 刻意不用 continue-on-error 以外的容錯：securities 表是空的（還沒
      # 跑過第一次 sync）或連不上證交所都會讓這步回傳非 0，但
      # state/twflow.db 裡先前輪詢累積的資料完全不受影響，下面還是要
      # 把「目前真實狀態」發布出去，所以這步失敗不該擋住 publish。
      - name: 盤中輪詢（單輪，非交易時段自動略過）
        continue-on-error: true
        run: twflow -c ci/config.ci.yaml poll --once

      - name: 發布靜態資料與累積資料庫
        uses: ./.github/actions/publish-static
