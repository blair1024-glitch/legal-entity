# 細分板塊定義（第二層分類）
#
# 分類分兩層：
#   第一層 = 證交所／櫃買的官方產業別（約 32 類，由 API 自動抓取，可靠）
#   第二層 = 這個檔案定義的細分板塊（自訂，可自由擴充）
#
# 沒有列在這裡的個股，會自動沿用官方產業別作為板塊，所以即使不編輯這個
# 檔案，儀表板一樣能運作——只是顆粒度比較粗。
#
# 誠實說明：官方**沒有**「108 板塊」這種東西。新聞裡提到的 108 是該 App
# 自訂的分類數。下面是一份涵蓋主要權值股的種子清單，要細到什麼程度由你決定，
# 直接往下加就行。
#
# 格式：
#   sectors:
#     板塊名稱: [股票代號, ...]

