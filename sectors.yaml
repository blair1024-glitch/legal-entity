# 細分板塊定義（第二層分類）
#
# 分類分兩層：
#   第一層 = 證交所／櫃買的官方產業別（約 32 類，由 API 自動抓取，可靠）
#   第二層 = 這個檔案定義的細分板塊（自訂，可自由擴充）
#
# 沒有列在這裡的個股會自動沿用官方產業別，所以即使完全不編輯這個檔案，
# 儀表板一樣能運作——只是顆粒度較粗。同一檔若出現在多個板塊，以先定義者為準。
#
# 誠實說明一：官方**沒有**「108 板塊」這種東西。新聞裡的 108 是那個 App 自訂的
# 分類數。下面是一份以主要權值股與熱門題材為主的清單，要細到什麼程度你自己決定。
#
# 誠實說明二：這份對照表是人工整理的，**可能有錯**。分類錯誤會讓該檔的資金流
# 被算進錯的板塊，而畫面上看不出異狀。建議你按自己的認知校對一遍，特別是
# 你實際會交易的標的。改完不需要重啟伺服器，重新整理頁面即可生效。
#
# 格式：
#   sectors:
#     板塊名稱: [股票代號, ...]

