# GitHub Actions 專用設定。
#
# 本機 Mac 版用的是 config.yaml（.gitignore 排除，使用者自己的機器才有），
# 這份反過來——是特地要進版控、給 Actions runner 讀的，所以裡面不能有
# 任何本機路徑或密鑰，只放這個環境真正需要覆寫的項目，其餘沿用
# src/twflow/config.py 的 DEFAULTS。
mode: live
db_path: state/twflow.db
retention_days: 3

# 實測發現：這個環境（GitHub Actions runner）用預設的 50 檔/批去打 MIS，
# 每批幾乎全部回 200／rtcode 正常、完全沒有錯誤訊息，但 msgArray 裡的
# 檔數經常只有請求數的一小部分——一輪 40 批下來，全市場 1982 檔最後只
# 拿回不到 300 檔報價。不確定是 MIS 對單次請求的檔數有遠比 50 小的上限，
# 還是這個環境的來源 IP 被另外限流／降級處理，所以先把批次縮小做實驗：
# 如果縮小後每批都能接近滿額拿回，代表是前者；如果還是大量漏，代表跟
# 批次大小無關。poller.py 現在每批都會把「請求幾檔／拿回幾檔」記進
# log，下次真的執行後要去看那份 log 才能確定該怎麼調。
poll:
  batch_size: 10
