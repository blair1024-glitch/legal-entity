# GitHub Actions 專用設定。
#
# 本機 Mac 版用的是 config.yaml（.gitignore 排除，使用者自己的機器才有），
# 這份反過來——是特地要進版控、給 Actions runner 讀的，所以裡面不能有
# 任何本機路徑或密鑰，只放這個環境真正需要覆寫的項目，其餘沿用
# src/twflow/config.py 的 DEFAULTS。
mode: live
db_path: state/twflow.db
retention_days: 3

# 實測發現（2026-10-02）：這個環境（GitHub Actions runner）打 MIS，
# 每批幾乎全部回 200／rtcode 正常、完全沒有錯誤訊息，但 msgArray 裡的
# 檔數經常只有請求數的一成多——一開始以為是單次請求帶太多檔，把
# batch_size 從 50 縮到 10 做實驗，結果命中率完全沒變（50 檔/批測到
# 9.5%、13.8%，10 檔/批測到 15.8%，199 批裡每一批都缺、缺的比例跟批次
# 大小無關）。代表瓶頸不是批次大小，比較像是這個來源 IP 被 MIS 用某種
# 抽樣／降級方式對待。batch_size 已經調回預設的 50（批次大小只影響
# 要發幾個請求、不影響命中率，大批次跑得快，沒理由縮小）。
#
# 真正的緩解是 poll.max_passes（見 poller.py 模組說明）：同一輪裡對
# 還缺的檔案再補抓幾次，命中率如果是獨立事件，兩三輪疊加下來覆蓋率
# 能從一成多拉到三四成。這裡先用預設值 3，之後看實際 log 再調。
poll:
  batch_size: 50
  max_passes: 3
